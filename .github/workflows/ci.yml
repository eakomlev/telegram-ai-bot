name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://bot:ci@localhost:5432/telegram_bot_test
      TELEGRAM_BOT_TOKEN: test
      OPENAI_API_KEY: test
      DOTENV_CONFIG_PATH: __test_env_not_present__
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: telegram_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d telegram_bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t telegram-ai-bot:ci .
